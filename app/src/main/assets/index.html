<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>납작 스캐너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="jspdf.umd.min.js"></script>
<script>window.jspdf || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>')</script>
<style>
:root{
  --bg:#E8ECE8; --surface:#F7F9F6; --ink:#14201B; --muted:#5B6A64; --line:#C9D1CC;
  --accent:#1D6B58; --accent-ink:#FFFFFF; --accent-soft:#D3E6DE; --handle:#F2A51A; --danger:#B3412F;
  --paper:#FFFFFF; --stage:#0C100F;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1513; --surface:#18201D; --ink:#E2EAE6; --muted:#94A39D; --line:#2C3833;
    --accent:#46BF9C; --accent-ink:#05231A; --accent-soft:#1D3A31; --handle:#F5B63A; --danger:#E47A67; --paper:#E9EDEA;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1513; --surface:#18201D; --ink:#E2EAE6; --muted:#94A39D; --line:#2C3833;
  --accent:#46BF9C; --accent-ink:#05231A; --accent-soft:#1D3A31; --handle:#F5B63A; --danger:#E47A67; --paper:#E9EDEA;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
button,input{-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-inline:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 150px;display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:20px;height:20px}
h1{font-size:22px;margin:0;letter-spacing:-.02em;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13.5px}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

.capture{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 14px;border-radius:12px;font:600 16px var(--sans);cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);user-select:none}
.cbtn svg{width:22px;height:22px;flex:none}
.cbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cbtn:focus-within,.btn:focus-visible,.chip:focus-visible,.icon:focus-visible{outline:2.5px solid var(--handle);outline-offset:2px}
.cbtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.hint{font-size:13px;color:var(--muted);margin:-10px 0 0}

.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px}
.sheet{position:relative;aspect-ratio:1/1.414;max-width:100%;background:var(--paper);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 18px -8px rgba(0,0,0,.25);overflow:hidden;cursor:pointer;border:0;padding:0;display:block;width:100%}
.sheet img{width:100%;height:100%;object-fit:contain;display:block}
.pno{position:absolute;left:6px;top:6px;font:500 11px var(--mono);background:rgba(20,32,27,.78);color:#fff;padding:2px 6px;border-radius:4px}
.tag{position:absolute;right:6px;top:6px;font-size:11px;font-weight:600;background:var(--handle);color:#231600;padding:1px 7px;border-radius:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:4px}
.icon{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.icon svg{width:17px;height:17px}
.icon:disabled{opacity:.35;cursor:default}
.icon.del{color:var(--danger)}
.meta{font-size:12px;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:760px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.name{flex:1 1 180px;display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.name input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 15px var(--sans);padding:11px 0 11px 12px;outline:none}
.name span{font:500 13px var(--mono);color:var(--muted);padding-right:12px}
.name:focus-within{border-color:var(--accent)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--sans);padding:10px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.btn{flex:1 0 auto;justify-content:center;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 15px var(--sans);padding:12px 18px;cursor:pointer;display:flex;gap:8px;align-items:center}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:default}

/* editor */
.ed{position:fixed;inset:0;background:var(--stage);color:#E8EEEB;z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ed-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
.ed-top h2{font-size:15px;margin:0;font-weight:600}
.tbtn{background:transparent;border:0;color:#E8EEEB;font:600 15px var(--sans);padding:8px 10px;border-radius:8px;cursor:pointer}
.tbtn.go{background:#46BF9C;color:#05231A}
.stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;touch-action:none}
.holder{position:relative}
.holder canvas{display:block}
.h{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;touch-action:none;cursor:grab}
.h::after{content:"";width:20px;height:20px;border-radius:50%;background:rgba(242,165,26,.25);border:3px solid #F2A51A;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}
.loupe{position:absolute;left:12px;top:12px;width:120px;height:120px;border-radius:50%;border:3px solid #F2A51A;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none}
.ed-tools{padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px}
.tools-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:1.5px solid #34423D;background:#161D1B;color:#DDE6E2;font:600 13.5px var(--sans);padding:8px 13px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:#46BF9C;border-color:#46BF9C;color:#05231A}
.lbl{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#8FA099;text-align:center}

.expbg{position:fixed;inset:0;background:rgba(10,14,13,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.exp{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.exp h3{margin:0;font-size:17px}
.exp p{margin:0 0 6px;color:var(--muted);font-size:13.5px;font-family:var(--mono)}
.btn.alt{background:var(--accent-soft);color:var(--ink)}
.plain{background:transparent;border:0;color:var(--muted);font:600 14px var(--sans);padding:10px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.busy{position:fixed;inset:0;background:rgba(10,14,13,.55);display:grid;place-items:center;z-index:50;color:#fff;font-weight:600}
.busy div{background:#18201D;padding:16px 22px;border-radius:12px;display:flex;gap:12px;align-items:center}
.spin{width:20px;height:20px;border:3px solid #46BF9C;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
@media (max-width:420px){.capture{grid-template-columns:1fr 1fr}.cbtn{padding:16px 8px;font-size:15px}.pages{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M4 6l14-2 2 14-14 2z"/><path d="M8 10h8M8 14h6"/></svg></div>
      <div><h1>납작 스캐너</h1><p class="sub">종이를 찍으면 반듯하게 펴서 PDF로</p></div>
    </div>
    <span class="count" id="count">0 pages</span>
  </header>

  <div class="capture">
    <label class="cbtn primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
      사진 찍기
      <input id="cam" type="file" accept="image/*" capture="environment">
    </label>
    <label class="cbtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 5 5 3-3 5 5"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>
      앨범에서
      <input id="gal" type="file" accept="image/*" multiple>
    </label>
  </div>
  <p class="hint">어두운 바닥 위에 종이를 두고 찍으면 모서리를 더 잘 찾아요. 페이지를 누르면 모서리·필터·회전을 고칠 수 있어요.</p>

  <section class="pages" id="pages" aria-label="스캔한 페이지"></section>
</div>

<div class="bar">
  <div class="bar-in">
    <label class="name" for="fname"><input id="fname" value="" placeholder="파일 이름" aria-label="파일 이름"><span>.pdf</span></label>
    <div class="seg" role="group" aria-label="페이지 크기">
      <button id="szA4" aria-pressed="true">A4</button>
      <button id="szFit" aria-pressed="false">원본 비율</button>
    </div>
    <button class="btn" id="make"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>PDF 만들기</button>
  </div>
</div>

<div class="ed" id="ed" hidden>
  <div class="ed-top">
    <button class="tbtn" id="edCancel">취소</button>
    <h2>모서리 맞추기</h2>
    <button class="tbtn go" id="edOk">적용</button>
  </div>
  <div class="stage" id="stage">
    <div class="holder" id="holder">
      <canvas id="edCv"></canvas>
    </div>
    <canvas class="loupe" id="loupe" width="240" height="240" hidden></canvas>
  </div>
  <div class="ed-tools">
    <div class="tools-row">
      <button class="chip" id="edAuto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg>자동 감지</button>
      <button class="chip" id="edFull"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16"/></svg>전체</button>
      <button class="chip" id="edRot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg><span id="rotLbl">회전 0°</span></button>
    </div>
    <div class="lbl">보정</div>
    <div class="tools-row" id="filters">
      <button class="chip" data-f="auto">자동 보정</button>
      <button class="chip" data-f="bw">흑백 문서</button>
      <button class="chip" data-f="gray">회색조</button>
      <button class="chip" data-f="none">원본</button>
    </div>
  </div>
</div>

<div class="expbg" id="exp" hidden>
  <div class="exp" role="dialog" aria-labelledby="expT">
    <h3 id="expT">PDF를 만들었어요</h3>
    <p id="expInfo"></p>
    <button class="btn" id="expSave">기기에 저장</button>
    <button class="btn alt" id="expShare">보내기 (카톡·메일·드라이브)</button>
    <button class="plain" id="expClose">닫기</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="busy" id="busy" hidden><div><span class="spin"></span><span id="busyTxt">처리 중…</span></div></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const MAX_SRC = 3000, MAX_OUT = 2200;
const state = { pages: [], size: 'a4', edit: null };
let uid = 0;

/* ---------- helpers ---------- */
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
const frame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
let toastT;
function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }
async function busy(msg, fn) { $('busyTxt').textContent = msg; $('busy').hidden = false; await frame(); try { return await fn(); } finally { $('busy').hidden = true; } }
function today() { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `스캔_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
$('fname').value = today();

/* ---------- load image ---------- */
function loadFile(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, MAX_SRC / Math.max(img.naturalWidth, img.naturalHeight));
      const c = mkCanvas(img.naturalWidth * s, img.naturalHeight * s);
      const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

/* ---------- document detection ---------- */
function detect(src) {
  const W0 = src.width, H0 = src.height, s = 320 / Math.max(W0, H0);
  const w = Math.max(2, Math.round(W0 * s)), h = Math.max(2, Math.round(H0 * s));
  const c = mkCanvas(w, h), x = c.getContext('2d', { willReadFrequently: true });
  x.filter = 'blur(1.5px)'; x.drawImage(src, 0, 0, w, h); x.filter = 'none';
  const d = x.getImageData(0, 0, w, h).data, n = w * h;
  const sc = new Uint8Array(n), hist = new Uint32Array(256);
  for (let i = 0; i < n; i++) {
    const r = d[i*4], g = d[i*4+1], b = d[i*4+2];
    const L = 0.299*r + 0.587*g + 0.114*b, sat = Math.max(r,g,b) - Math.min(r,g,b);
    const v = Math.max(0, Math.min(255, L - 1.1*sat)); sc[i] = v; hist[v|0]++;
  }
  // Otsu
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sB = 0, wB = 0, best = 0, t = 128;
  for (let i = 0; i < 256; i++) { wB += hist[i]; if (!wB) continue; const wF = n - wB; if (!wF) break; sB += i * hist[i];
    const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) ** 2; if (v > best) { best = v; t = i; } }
  let m = new Uint8Array(n); for (let i = 0; i < n; i++) m[i] = sc[i] > t ? 1 : 0;
  // open (erode then dilate) to cut thin bridges
  const morph = (a, er) => { const o = new Uint8Array(n);
    for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) { let v = er ? 1 : 0;
      for (let dy = -2; dy <= 2 && (er ? v : !v); dy++) for (let dx = -2; dx <= 2; dx++) {
        const yy = Math.min(h-1, Math.max(0, y+dy)), x2 = Math.min(w-1, Math.max(0, xx+dx)); const q = a[yy*w+x2];
        if (er && !q) { v = 0; break; } if (!er && q) { v = 1; break; } }
      o[y*w+xx] = v; } return o; };
  m = morph(morph(m, true), false);
  // largest component
  const lab = new Int32Array(n), stack = new Int32Array(n); let bestL = 0, bestN = 0, cur = 0;
  for (let i = 0; i < n; i++) { if (!m[i] || lab[i]) continue; cur++; let sp = 0, cnt = 0; stack[sp++] = i; lab[i] = cur;
    while (sp) { const p = stack[--sp]; cnt++; const px = p % w, py = (p / w) | 0;
      if (px > 0 && m[p-1] && !lab[p-1]) { lab[p-1] = cur; stack[sp++] = p-1; }
      if (px < w-1 && m[p+1] && !lab[p+1]) { lab[p+1] = cur; stack[sp++] = p+1; }
      if (py > 0 && m[p-w] && !lab[p-w]) { lab[p-w] = cur; stack[sp++] = p-w; }
      if (py < h-1 && m[p+w] && !lab[p+w]) { lab[p+w] = cur; stack[sp++] = p+w; } }
    if (cnt > bestN) { bestN = cnt; bestL = cur; } }
  const inset = () => { const a = W0 * 0.06, b = H0 * 0.06; return [[a,b],[W0-a,b],[W0-a,H0-b],[a,H0-b]]; };
  if (bestN < n * 0.08 || bestN > n * 0.97) return inset();
  // extreme points in 24 directions
  const K = 24, dirs = [], bestV = new Float64Array(K).fill(-Infinity), bestP = new Array(K);
  for (let k = 0; k < K; k++) dirs.push([Math.cos(k * Math.PI * 2 / K), Math.sin(k * Math.PI * 2 / K)]);
  let cx = 0, cy = 0;
  for (let i = 0; i < n; i++) { if (lab[i] !== bestL) continue; const px = i % w, py = (i / w) | 0; cx += px; cy += py;
    for (let k = 0; k < K; k++) { const v = px * dirs[k][0] + py * dirs[k][1]; if (v > bestV[k]) { bestV[k] = v; bestP[k] = [px, py]; } } }
  cx /= bestN; cy /= bestN;
  const uniq = []; bestP.forEach(p => { if (!uniq.some(q => q[0] === p[0] && q[1] === p[1])) uniq.push(p); });
  uniq.sort((a, b) => Math.atan2(a[1]-cy, a[0]-cx) - Math.atan2(b[1]-cy, b[0]-cx));
  if (uniq.length < 4) return inset();
  const area = q => { let s2 = 0; for (let i = 0; i < 4; i++) { const a = q[i], b = q[(i+1)%4]; s2 += a[0]*b[1] - b[0]*a[1]; } return Math.abs(s2) / 2; };
  let bq = null, ba = 0; const U = uniq.length;
  for (let a = 0; a < U; a++) for (let b = a+1; b < U; b++) for (let c2 = b+1; c2 < U; c2++) for (let e = c2+1; e < U; e++) {
    const q = [uniq[a], uniq[b], uniq[c2], uniq[e]], ar = area(q); if (ar > ba) { ba = ar; bq = q; } }
  if (!bq || ba < n * 0.06) return inset();
  return orderQuad(bq.map(p => [(p[0] + 0.5) / s, (p[1] + 0.5) / s]));
}
function orderQuad(q) {
  const cx = q.reduce((a, p) => a + p[0], 0) / 4, cy = q.reduce((a, p) => a + p[1], 0) / 4;
  const o = q.slice().sort((a, b) => Math.atan2(a[1]-cy, a[0]-cx) - Math.atan2(b[1]-cy, b[0]-cx));
  let ti = 0; o.forEach((p, i) => { if (p[0] + p[1] < o[ti][0] + o[ti][1]) ti = i; });
  return [0,1,2,3].map(i => o[(ti + i) % 4]);
}

/* ---------- perspective warp ---------- */
function solveH(from, to) {

  if (window.Android) {
    const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
    lastPdf = { b64, name };
    $('expInfo').textContent = `${name} · ${state.pages.length}쪽 · ${(blob.size / 1048576).toFixed(1)}MB`;
    $('exp').hidden = false; return;
  }
  const dl = await getDownloads();
  if (!dl) { toast('이 화면에서는 파일 저장을 쓸 수 없어요. Claude 앱이나 브라우저에서 열어 주세요.', 4200); return; }
  try { const r = await dl.save({ filename: name, data: blob }); if (r.status === 'saved') toast(`${name} 저장 완료 · ${(blob.size / 1048576).toFixed(1)}MB`, 3600); }
  catch (e) { const c = e && e.code;
    if (c === 'declined') toast('저장을 취소했어요');
    else if (c === 'rate_limited') toast('저장 창이 이미 열려 있어요. 잠시 후 다시 눌러 주세요.');
    else if (c === 'too_large') toast('파일이 너무 커요. 페이지 수를 나눠서 저장해 주세요.', 4000);
    else toast('이 화면에서는 파일 저장을 쓸 수 없어요.', 4000); }
};

/* ---------- start with an example page ---------- */
(async () => {
  try { if (document.fonts && document.fonts.load) await Promise.race([document.fonts.load('700 20px "IBM Plex Sans KR"'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  const src = makeSample(); const p = { id: ++uid, src, quad: detect(src), rot: 0, filter: 'auto', sample: true }; process(p); state.pages.push(p); render();
})();
render();
})();
</script>
